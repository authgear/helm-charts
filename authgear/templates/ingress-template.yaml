apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "authgear.nameIngressTemplate" . | quote }}
  labels:
    {{- include "authgear.labels" . | nindent 4 }}
data:
  ingress.tpl.yaml: |-
    {{ "{{ if .IsCustom }}" }}
    {{- range $controllerIndex, $controller := (include "authgear.customDomainIngressControllers" $ | fromYaml).controllers }}
    {{- if gt $controllerIndex 0 }}
    ---
    {{- end }}
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: {{ $controller.name }}-{{ "{{ .Host }}" }}
      annotations:
        {{- with $controller.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app.kubernetes.io/managed-by: authgear
    spec:
      ingressClassName: {{ $controller.class | quote }}
      tls:
      - hosts:
        - {{ "{{ .Host }}" }}
        secretName: tls-{{ "{{ .Host }}" }}
      rules:
      - host: {{ "{{ .Host }}" }}
        http:
          paths:
          - path: /_api/admin
            pathType: Prefix
            backend:
              service:
                name: {{ include "authgear.nameAdmin" $ | quote }}
                port:
                  number: 80
          - path: /_resolver
            pathType: Prefix
            backend:
              service:
                name: {{ include "authgear.nameResolver" $ | quote }}
                port:
                  number: 80
          - path: /_images
            pathType: Prefix
            backend:
              service:
                name: {{ include "authgear.nameImages" $ | quote }}
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "authgear.nameMain" $ | quote }}
                port:
                  number: 80
    {{- end }}
    {{- if $.Values.authgear.certManager.enabled }}
    ---
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: cert-{{ "{{ .Host }}" }}
      labels:
        app.kubernetes.io/managed-by: authgear
    spec:
      dnsNames:
      - {{ "{{ .Host }}" }}
      issuerRef:
        name: {{ $.Values.authgear.certManager.issuer.http01.name | quote }}
        kind: {{ $.Values.authgear.certManager.issuer.http01.kind | quote }}
        group: {{ $.Values.authgear.certManager.issuer.http01.group | quote }}
      secretName: tls-{{ "{{ .Host }}" }}
    {{- end }}
    {{ "{{ end }}" }}
